name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional @tag filter, e.g. @tenant (leave blank to run the whole suite)'
        type: string
        default: ''

concurrency:
  group: meridian-qa-suite
  cancel-in-progress: false

permissions:
  contents: write   # the dashboard step force-pushes the report site to gh-pages

jobs:
  # Fast and needs no Docker/DB — runs first so a broken permission/limit/
  # usage/billing calculation fails the build in seconds, not after a 30
  # minute Docker + Playwright run (qa-developer-take-home-brief.md's Part B).
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Every spec under apps/api/src/**/*.spec.ts mocks DbService rather
      # than hitting a real database. Coverage thresholds are enforced by
      # apps/api/jest.config.js itself — a threshold miss fails this step
      # (non-zero exit) same as a failing test would, which is what stops
      # the playwright job below from ever starting.
      - name: Run unit tests with coverage
        run: npm run test:coverage --workspace=apps/api

      # Always, not just on success — the dashboard job needs this even when
      # a test or threshold failed, so a red run still shows up instead of
      # silently vanishing.
      - name: Upload coverage and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: apps/api/coverage/
          retention-days: 14

  # Only starts once unit-tests succeeds (the default `needs` behaviour skips
  # this job otherwise) — the E2E suite's own 30 minutes of Docker/browser
  # time isn't worth spending on a commit the fast unit tests already failed.
  playwright:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # push events have no `inputs` context, so this falls back to blank
      # (run the whole suite) same as a manual run left blank.
      QA_TAG: ${{ github.event.inputs.tag }}
    steps:
      # Check out the repo at the pushed commit so the workflow can run its code.
      - uses: actions/checkout@v4

      # Install Node.js 20 and put it on PATH for later steps.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install exact dependency versions from package-lock.json (clean, reproducible install).
      - name: Install dependencies
        run: npm ci

      # postgres, redis, the mock billing provider, the API, and now `web` too —
      # tests/functional/overview/*.spec.ts drives it directly (the first, so
      # far only, browser-based spec in the suite).
      - name: Start Docker Compose services
        run: docker compose up -d --build postgres redis mock-billing api web

      # Only needed for @ui specs (tests/functional/overview/*,
      # tests/functional/memberships/memberships.spec.ts) — every @api spec
      # uses Playwright's `request` fixture, which needs no browser binary at
      # all. playwright.config.ts's chromium/firefox/webkit projects only run
      # @ui specs (see that file's own comment), so all three are needed here.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # depends_on/healthy only covers postgres and redis being ready before the
      # api/web containers *start* — neither has its own healthcheck block, so
      # poll each one's own readiness before tests assume it's ready.
      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time" >&2
          docker compose logs api
          exit 1

      - name: Wait for web to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/login > /dev/null; then
              echo "web is ready"
              exit 0
            fi
            sleep 2
          done
          echo "web did not become ready in time" >&2
          docker compose logs web
          exit 1

      # The test framework's own .env (see config/.env.example's header) — every
      # value in it is Meridian's own dev-only seeded config, not a real secret,
      # so no repository secrets are needed to run this suite.
      - name: Configure test environment
        run: cp tests/functional/config/.env.example tests/functional/config/.env

      # Every mutating spec now writes only to its own dedicated scratch
      # tenant (docs/qa/conventions.md rule 9), so a create/delete can never
      # race a list/count assertion elsewhere — no phase split needed, one
      # invocation across the whole suite. --pass-with-no-tests: an empty
      # @tag selection (a typo'd manual filter) would otherwise exit 1.
      - name: Run Playwright tests
        run: npx playwright test --pass-with-no-tests ${QA_TAG:+--grep "$QA_TAG"}

      # Post-process the run's results and fail the build if any test only passed on retry.
      - name: Fail build if any test was flaky
        run: node scripts/check-flaky.js test-report/results.json

      # Publish the HTML report as a downloadable artifact, even when earlier steps failed.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-report/
          retention-days: 14

      # Traces/screenshots from failed tests only, uploaded only when the run failed.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------
  # Publish this run to the GitHub Pages dashboard: last 10 runs with their
  # counts and a link to each run's full HTML report, served inline so there
  # is nothing to download. `needs` both jobs but `if: always()` so this
  # still runs — and the dashboard still gets a row — whether unit-tests
  # failed (playwright then never ran at all) or playwright itself failed.
  # ---------------------------------------------------------------------
  publish-dashboard:
    needs: [unit-tests, playwright]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Always uploaded by unit-tests (that job's own upload step is also
      # `if: always()`), so this should always be there — continue-on-error
      # is just defensive, matching the same posture as the dashboard
      # checkout below.
      - name: Download unit test coverage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: unit-test-coverage
          path: unit-coverage

      # Only exists if playwright actually ran (needs: unit-tests skips it
      # entirely on a failed unit-tests job) — build-report-dashboard.js
      # already handles a missing/unreadable results.json by recording the
      # run with hasResults: false rather than throwing.
      - name: Download Playwright report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: test-report

      # Grab the currently-published site so the builder can carry the four most
      # recent prior reports forward. First ever run: the branch doesn't exist,
      # so this is allowed to fail and the builder starts from an empty list.
      - name: Check out existing dashboard
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build dashboard site
        run: node scripts/build-report-dashboard.js test-report/results.json test-report gh-pages public unit-coverage

      # Force-push the assembled ./public wholesale — the branch only ever holds
      # the last 10 runs, so purging is automatic.
      - name: Publish dashboard to gh-pages
        working-directory: public
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "test dashboard: run #${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
