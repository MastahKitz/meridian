name: Playwright Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional extra @tag filter, e.g. @tenant (ANDed with the mutating/non-mutating split; leave blank to run everything in each phase)'
        type: string
        default: ''

concurrency:
  group: meridian-qa-suite
  cancel-in-progress: false

permissions:
  contents: write   # the dashboard step force-pushes the report site to gh-pages

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # push events have no `inputs` context, so this falls back to blank
      # (run everything in each phase) same as a manual run left blank.
      QA_TAG: ${{ github.event.inputs.tag }}
    steps:
      # Check out the repo at the pushed commit so the workflow can run its code.
      - uses: actions/checkout@v4

      # Install Node.js 20 and put it on PATH for later steps.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install exact dependency versions from package-lock.json (clean, reproducible install).
      - name: Install dependencies
        run: npm ci

      # Bring up just what the API-layer suite needs — postgres, redis, the mock
      # billing provider, and the API itself. `web` isn't started: nothing
      # exercises it yet (no UI/browser tests exist), so building it here would
      # only slow the run down. Add it back once an E2E layer needs it.
      - name: Start Docker Compose services
        run: docker compose up -d --build postgres redis mock-billing api

      # depends_on/healthy only covers postgres and redis being ready before the
      # api container *starts* — the api service itself has no healthcheck
      # block, so poll its own health endpoint before tests assume it's ready.
      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time" >&2
          docker compose logs api
          exit 1

      # The test framework's own .env (see config/.env.example's header) — every
      # value in it is Meridian's own dev-only seeded config, not a real secret,
      # so no repository secrets are needed to run this suite.
      - name: Configure test environment
        run: cp tests/functional/config/.env.example tests/functional/config/.env

      # Non-mutating first, then mutating — two separate `playwright test`
      # invocations, not a single run across both projects and not a `dependencies`
      # gate, so a create/delete never races a list/count assertion elsewhere
      # (docs/qa/conventions.md rule 9; each invocation gets its own fresh
      # global.setup reseed too). --pass-with-no-tests: an extra @tag that only
      # exists in one phase leaves the other phase with an empty selection, and
      # Playwright treats "no tests" as exit 1 by default.
      - name: Run Playwright tests - non-mutating
        env:
          PW_PHASE: non-mutating
        run: npx playwright test --project=non-mutating --pass-with-no-tests ${QA_TAG:+--grep "$QA_TAG"}

      # Playwright's blob reporter clears its WHOLE outputDir on every write,
      # not just its own file — so this phase's zip has to be moved out of
      # blob-report/ before the next phase starts, or it's wiped when that
      # phase's blob reporter writes.
      - name: Collect non-mutating-phase report
        if: always()
        run: |
          mkdir -p merged-blobs
          cp blob-report/non-mutating.zip merged-blobs/

      - name: Run Playwright tests - mutating
        if: always()
        env:
          PW_PHASE: mutating
        run: npx playwright test --project=mutating --pass-with-no-tests ${QA_TAG:+--grep "$QA_TAG"}

      - name: Collect mutating-phase report
        if: always()
        run: cp blob-report/mutating.zip merged-blobs/

      - name: Merge phase reports
        if: always()
        run: npx playwright merge-reports --config=playwright.config.ts merged-blobs

      # Post-process the run's results and fail the build if any test only passed on retry.
      - name: Fail build if any test was flaky
        run: node scripts/check-flaky.js test-report/results.json

      # Publish the HTML report as a downloadable artifact, even when earlier steps failed.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-report/
          retention-days: 14

      # Traces/screenshots from failed tests only, uploaded only when the run failed.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v

      # ---------------------------------------------------------------------
      # Publish this run to the GitHub Pages dashboard: last 10 runs with their
      # counts and a link to each run's full HTML report, served inline so there
      # is nothing to download. Runs even when tests failed, so the dashboard
      # always reflects the latest state.
      # ---------------------------------------------------------------------

      # Grab the currently-published site so the builder can carry the four most
      # recent prior reports forward. First ever run: the branch doesn't exist,
      # so this is allowed to fail and the builder starts from an empty list.
      - name: Check out existing dashboard
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build dashboard site
        if: always()
        run: node scripts/build-report-dashboard.js test-report/results.json test-report gh-pages public

      # Force-push the assembled ./public wholesale — the branch only ever holds
      # the last 10 runs, so purging is automatic.
      - name: Publish dashboard to gh-pages
        if: always()
        working-directory: public
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "test dashboard: run #${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
